<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFit - Admin Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Link -->
    <link rel="stylesheet" href="Admin .css">
</head>
<body>
 
    <div class="login-card">
        <h2>Admin Login</h2>
        <p class="subtitle">Enter your credentials</p>

        <form>
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter password">
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>
            </div>

            <button type="submit" class="login-btn">LOGIN</button>
        </form>
    </div>
    <script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); // Page ko refresh hone se rokenge

        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();

        // Yahan apna admin ka username aur password set kar lijiye
        if (user === "admin" && pass === "12345") {
            alert("Admin Login Successful!");
            window.location.href = "AdminDash.html"; // Admin dashboard par bhej dega
        } else {
            alert("Galat Username ya Password hai!");
        }
    });
</script>
     <script src="script.js"></script>

</body>

</html>
