<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="details.css">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; background-color: #fff; }
        
        /* Main Layout Grid */
        .details-container { 
            display: flex; 
            gap: 30px; 
            max-width: 1000px; 
            margin: 20px auto; 
            padding: 20px; 
            align-items: flex-start;
        }

        /* Left Image Section */
        .image-section { display: flex; gap: 15px; width: 50%; }
        .thumbnail-container { display: flex; flex-direction: column; gap: 10px; }
        .thumb-img { width: 60px; height: 75px; object-fit: cover; border-radius: 6px; cursor: pointer; }
        .thumb-img.active { border: 2px solid #111; }
        .main-image-container { flex: 1; }
        .main-image-container img { width: 100%; height: 420px; object-fit: contain; border-radius: 8px; }

        /* Right Details Section */
        .info-section { width: 50%; display: flex; flex-direction: column; justify-content: center; }
        .info-section h1 { font-size: 24px; color: #111; margin-bottom: 8px; }
        .info-section .price { font-size: 22px; color: #2c3e50; font-weight: 700; margin-bottom: 15px; }

        /* Sizes */
        .size-selection { margin-bottom: 20px; }
        .size-selection label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px; }
        .size-options { display: flex; gap: 10px; }
        .size-btn { border: 1px solid #ccc; background: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .size-btn.selected { border-color: #111; background: #111; color: #fff; }

        /* Product Info Box */
        .product-info-box {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 15px;
        }

        .product-info-box h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            color: #222;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 15px;
            margin-bottom: 15px;
        }

        .info-item { display: flex; flex-direction: column; }
        .info-key { font-size: 12px; color: #666; }
        .info-val { font-size: 14px; font-weight: 500; color: #111; }

        /* Buttons */
        .size-rec-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 12px;
            width: 100%;
        }

        .add-to-buy-btn {
            width: 100%;
            background-color: #111;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .add-to-buy-btn:hover { background-color: #333; }
    </style>
</head>
<body>

    <div class="details-container">
        <!-- Left Side: Images -->
        <div class="image-section">
            <div class="thumbnail-container">
                <img class="thumb-img active" id="thumb1" src="e1.jpeg" alt="thumb" onclick="changeImage(this)">
<img class="thumb-img" id="thumb2" src="e2.jpeg" alt="thumb" onclick="changeImage(this)">

   </div>
            <div class="main-image-container">
                <img id="product-main-img" src="e1.jpeg" alt="Product Image">
            
            </div>
            
        </div>

        <!-- Right Side: Product Details & Info Box -->
        <div class="info-section">
            <h1 id="product-title">Elegant Evening Gown</h1>
            <div class="price" id="product-price">₹3,499</div>

            <!-- Size Selection -->
            <div class="size-selection">
                <label>Select Size:</label>
                <div class="size-options">
                    <button class="size-btn" onclick="selectSize(this)">S</button>
                    <button class="size-btn" onclick="selectSize(this)">M</button>
                    <button class="size-btn" onclick="selectSize(this)">L</button>
                    <button class="size-btn" onclick="selectSize(this)">XL</button>
                    <button class="size-btn" onclick="selectSize(this)">XXL</button>
                </div>
            </div>

            <!-- Right Box with Info and Buttons -->
            <div class="product-info-box">
                <h4>Product Information</h4>
                <div class="info-grid" id="info-grid">
                    <!-- Dynamic JavaScript Content -->
                </div>

                <button class="size-rec-btn" onclick="window.location.href='size.html'">Size-Recommendation</button>

                <button id="add-to-buy-btn" class="add-to-buy-btn">
                    Add to cart
                </button>
                <button id="add-to-buy-btn" class="add-to-buy-btn">
                    Buy Now
                </button>
            </div>
        </div>
    </div>
    <script>
document.getElementById('add-to-buy-btn').addEventListener('click', function () {

    let product = JSON.parse(localStorage.getItem('selectedProduct'));

    if (!product) {
        alert('Product select nahi hua!');
        return;
    }

    let selectedButton = document.querySelector('.size-btn.selected');

    if (!selectedButton) {
        alert('Please pehle size select karo!');
        return;
    }

    product.selectedSize = selectedButton.innerText.trim();
    product.quantity = 1;

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    cart.push(product);

    localStorage.setItem('cart', JSON.stringify(cart));

    alert('Product cart mein add ho gaya!');

    window.location.href = 'cart.html';
});
</script>

<script src="script.js"></script>
</body>
</html>
