<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFit - Manage Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="AdminDash.css">
</head>
<body>

    <div class="admin-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-sliders"></i>
            </div>
            <nav class="nav-menu">
                <a href="AdminDash.html" class="nav-item">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                    <span>Dashboard</span>
                </a>
                <a href="product.html" class="nav-item">
                    <i class="fa-solid fa-box-archive"></i>
                    <span>Products</span>
                </a>
                <a href="order.html" class="nav-item active">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Orders</span>
                </a>
                <a href="users.html" class="nav-item">
                    <i class="fa-regular fa-user"></i>
                    <span>Users</span>
                </a>
            </nav>
            <div class="logout">
                <a href="login.html" class="nav-item">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <a href="index.html" style="display: inline-block; margin-bottom: 15px; text-decoration: none; color: #333; font-weight: bold;">← Back to Home</a>
            <header class="top-header">
                <h2>Orders Management</h2>
                <div class="user-profile">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Admin</span>
                </div>
            </header>

            <div class="content-body">
                <div class="action-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3>All Orders</h3>
                    <button id="openModalBtn" style="padding: 10px 18px; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                        <i class="fa-solid fa-plus"></i> Create New Order
                    </button>
                </div>

                <!-- Orders Table -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer Name</th>
                                <th>Item</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody">
                            <!-- Orders dynamic Javascript se yahan render honge -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Order Modal (Popup Box) -->
    <div id="orderModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;">
        <div style="background: #fff; padding: 25px; border-radius: 10px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 15px;">Add New Order</h3>
            <form id="orderForm">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 13px; margin-bottom: 4px;">Customer Name</label>
                    <input type="text" id="custName" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 13px; margin-bottom: 4px;">Item Name</label>
                    <input type="text" id="itemName" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 13px; margin-bottom: 4px;">Amount (₹)</label>
                    <input type="number" id="itemAmount" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 13px; margin-bottom: 4px;">Status</label>
                    <select id="orderStatus" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="closeModalBtn" style="padding: 8px 14px; background: #ccc; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
                    <button type="submit" style="padding: 8px 14px; background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Save Order</button>
                </div>
            </form>
        </div>
    </div>
   
    <!-- JavaScript File Connection -->
    <script src="o.js"></script>
</body>
</html>
